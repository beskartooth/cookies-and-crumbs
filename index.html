<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Cookies and Crumbs</title>
  </head>
  <body>
    <div id="app">
      <header class="header">
        <h1 class="title">Cookies and Crumbs</h1>
        <div class="score-wrap" aria-live="polite">
          <span class="score-label">Score</span>
          <span id="score" class="score">0</span>
        </div>
      </header>
      <main class="board-wrap">
        <canvas id="board" width="800" height="800" aria-label="Cookie match board"></canvas>
      </main>
      <p class="hint">Swap adjacent cookies · Match 3+</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
